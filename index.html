    border-radius: 50%;

      radial-gradient(1.5px 1.5px at 55% 90%, #8fffb0 0%, rgba(143,255,176,0) 70%);
    animation: flicker 5s ease-in-out infinite alternate;
  }

  @keyframes flicker {
    0%   { opacity: 0.35; }
    30%  { opacity: 0.9; }
    50%  { opacity: 0.4; }
    70%  { opacity: 1; }
    100% { opacity: 0.5; }
